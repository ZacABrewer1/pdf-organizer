name: Build Windows Executable and Share

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyPDF2 pillow pyinstaller requests
        
    - name: Build executable
      run: python build_exe.py
      
    - name: Upload to file.io
      run: |
        pip install requests
        $response = Invoke-RestMethod -Uri "https://file.io/" -Method Post -Form @{file=Get-Item -Path "dist/PDF-Organizer.exe"}
        echo "Download URL: $($response.link)"
