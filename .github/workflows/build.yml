name: Build Windows Executable and Host

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyPDF2 pillow pyinstaller
        
    - name: Build executable
      run: python build_exe.py
      
    - name: Create download page
      run: |
        mkdir download_page
        copy dist\PDF-Organizer.exe download_page\
        echo "<html><head><title>PDF Organizer Download</title></head><body><h1>PDF Organizer Download</h1><p><a href='PDF-Organizer.exe'>Click here to download PDF-Organizer.exe</a></p></body></html>" > download_page\index.html
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./download_page
        force_orphan: true
